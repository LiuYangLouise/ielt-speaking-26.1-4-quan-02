                { id: "eventsKeep26", title: "传统节日的食物", batch: "keep", part2: { instruction: "Describe your favourite food at a traditional festival or a special event in your country.", youShouldSay: ["What it is", "At which festival/event you eat it", "How it is made", "And explain why you like it"] }, part3: { questions: ["Do people in your country grow plants at home?", "What plants can people grow in cities?", "Are there any difficulties when people grow plants in cities?", "Do most people prefer vegetables bought from the supermarket or grown at home?", "Why do people like to have a big meal at traditional festivals or big events?", "Is it bad behavior for people to look at their phones during a meal?"] } },
                { id: "eventsKeep28", title: "看到野生动物的地方", batch: "keep", part2: { instruction: "Describe a place you know where people can see a lot of wildlife.", youShouldSay: ["Where it is", "What kinds of wildlife people can see there", "Whether people like to go there", "And explain how you feel about it"] }, part3: { questions: ["Why are most children interested in wild animals?", "Should parents take their children to the zoo to see wild animals?", "Are wild animals easy to spot in your country?", "Are there many wildlife documentaries produced in your country?", "What impacts does only seeing wild animals in zoos have on children's understanding of these animals?", "Which is the better way to see wildlife, watching documentaries or going into the wild?"] } },
                { id: "eventsKeep31", title: "向小辈展示新东西", batch: "keep", part2: { instruction: "Describe a time that you showed something which was new to a person who was younger than you.", youShouldSay: ["When it was", "What it was", "Who you showed it to", "How you showed it", "Why you showed it", "And explain how you felt about it"] }, part3: { questions: ["What skills should children learn?", "What are the differences between the things adults learn and the things that children learn?", "Why are some people not willing to ask help from others while studying?", "What skills do you think children should learn before going to school?", "How can young people be motivated to learn new things?", "Is it possible for a person to achieve something without motivation?"] } },
                { id: "eventsKeep33", title: "印象深刻的课程", batch: "keep", part2: { instruction: "Describe a course that impressed you a lot.", youShouldSay: ["What the course was about", "Where you took the course", "What you did during the course", "And explain why it impressed you a lot"] }, part3: { questions: ["Why do some people have a better memory than others?", "Do people like things of memorial significance?", "Which can help people remember things better, words or photos?", "Can technology help people remember things better? How?", "What do people need to remember in their daily lives?", "What can we learn from history?"] } },
                { id: "eventsKeep35", title: "组织快乐活动", batch: "keep", part2: { instruction: "Describe a time when you organized a happy event successfully.", youShouldSay: ["What the event was", "How you prepared for it", "Who helped you to organize it", "And explain why you think it was a successful event"] }, part3: { questions: ["How can parents help children to be organized?", "On what occasions do people need to be organized?", "Does everything need to be well prepared?", "Do people need others' help when organizing things?", "How would you feel when you were not well prepared for something?", "Do you prefer to prepare and organize an activity or just take part in an activity?"] } },
                { id: "eventsKeep38", title: "提高注意力", batch: "keep", part2: { instruction: "Describe something you do that can help you concentrate on work/study.", youShouldSay: ["What it is", "How it helps you concentrate", "When you do it", "And explain how you feel about it"] }, part3: { questions: ["Why is it more difficult for children to concentrate nowadays than in the past?", "Do you think technology will harm children's ability to concentrate?", "What kinds of jobs require high concentration at work?", "Can exercise help people improve concentration?", "Is it important for children to concentrate on their studies? Why?", "What can people do to improve their ability to concentrate?"] } },
                { id: "eventsKeep40", title: "有趣的讨论", batch: "keep", part2: { instruction: "Describe an interesting discussion you had with your friend.", youShouldSay: ["What the discussion was about", "What opinions you and your friend had", "Why you think the discussion was interesting", "And how you felt about it"] }, part3: { questions: ["When do children normally form their own views?", "Do children have strong opinions?", "Should parents require their kids to obey them?", "In what industries do you think communication is a necessary skill?", "Should parents consider their children's opinions on everything? Why?", "Why do some young people refuse to communicate with others?"] } },
                { id: "eventsKeep44", title: "花费甚少的外出日", batch: "keep", part2: { instruction: "Describe a special day out that cost you little money.", youShouldSay: ["When the day was", "Where you went", "How much you spent", "And explain how you feel about the day"] }, part3: { questions: ["Do people like to spend their leisure time out in your country?", "How do people spend their leisure time in your country?", "How does technology affect the way people spend their leisure time?", "Do you think only old people have time for leisure?", "Why do people like to have days off?", "Going out to have holidays is tiring. Why do people still want to do it?"] } },
                { id: "eventsKeep47", title: "语言学习", batch: "keep", part2: { instruction: "Describe a thing you did to learn another language.", youShouldSay: ["What language you learned", "What you did", "How it helped you learn the language", "And how you felt about it"] }, part3: { questions: ["What difficulties do people face when learning a language?", "Do you think language learning is important? Why?", "Which is better, to study a language alone or to study it in a group? Why?", "What's the best way to learn a language?", "What are the advantages and disadvantages of learning a language?", "Some people think that technology has made it unnecessary to learn languages. What do you think?"] } },
                { id: "eventsKeep48", title: "惊喜之事", batch: "keep", part2: { instruction: "Describe something that surprised you and made you happy.", youShouldSay: ["What it was", "Who did this", "How you found out about it and what you did", "And explain why it surprised you and made you happy"] }, part3: { questions: ["How do people express happiness in your culture?", "Do you think happiness has any effect on people? How?", "How can people be happy?", "Is it good for people to be unhappy? Why?", "Do men and women have different attitudes and feelings about shopping?", "What do people usually spend money on?"] } },
                { id: "eventsKeep49", title: "远距离步行", batch: "keep", part2: { instruction: "Describe a long walk you ever had.", youShouldSay: ["When this happened", "Where you walked", "Who you were with", "And explain how you felt about this long walk"] }, part3: { questions: ["What outdoor activities do people like?", "What are the differences between the outdoor activities children did in the past and now?", "Is leisure time important to everyone? Why?", "Do women have more leisure time than men?", "What are the benefits of outdoor activities for children?", "Do you think that walking is not as helpful as playing other sports for our health?"] } },
                { id: "eventsKeep50", title: "一次非常忙碌的经历", batch: "keep", part2: { instruction: "Describe a time you were very busy.", youShouldSay: ["When it happened", "Where you were", "What you did", "And explain why you were busy"] }, part3: { questions: ["Are you often busy?", "What are the advantages and disadvantages when people keep busy?", "Do you think children should learn through playing games or under pressure?", "What kind of pressure people may experience at work?", "How does technology help with time management?", "Does technology distract people?"] } },
                { id: "eventsKeep52", title: "困难决定终成功", batch: "keep", part2: { instruction: "Describe a difficult decision that you made and had a good result.", youShouldSay: ["What the decision was", "When you made that decision", "Why it was difficult to make", "And explain how you felt about the good result"] }, part3: { questions: ["Do you think it's necessary for kids to make as many decisions by themselves as they can?", "Do you think some people can make decisions without asking for advice from others?", "Do you think young people are easily influenced by others when they make decisions? Why or why not?", "What kinds of decisions do young people have to make?", "Who do young people like to ask for advice when making decisions?", "Do advertisements influence consumers' decisions?"] } },
                { id: "eventsKeep54", title: "庆祝过的活动", batch: "keep", part2: { instruction: "Describe an important event you celebrated.", youShouldSay: ["What the event was", "When it happened", "Who attended the event", "And explain how you felt about the event"] }, part3: { questions: ["Do people often celebrate festivals with families?", "Do people often celebrate events with a large group of people or just a few people?", "What kinds of events do people usually celebrate?", "Do you like to celebrate important events? Why?", "Why is it important to celebrate festivals?", "Do most people like to share their good news with others?"] } },
                { id: "eventsKeep55", title: "想参加的比赛", batch: "keep", part2: { instruction: "Describe a contest/competition you would like to participate in.", youShouldSay: ["What the contest/competition is about", "Where the contest/competition will take place", "When it will be held", "And explain why you would like to participate in it"] }, part3: { questions: ["What are the contests commonly seen on TV programs?", "Why are competition shows popular?", "What kinds of industries need competition? Why?", "Do you think it is necessary to encourage people to compete with one another in companies?", "What kinds of people like to take part in competitions?", "Do you think the ability to compete is natural or learned?"] } },
                { id: "eventsKeep58", title: "对社会有贡献的人", batch: "keep", part2: { instruction: "Describe a person who contributes to the society.", youShouldSay: ["Who this person is", "How you knew him/her", "What type of work he/she does", "And explain why you think he/she contributes to the society"] }, part3: { questions: ["What jobs are well-paid?", "What are the changes in working conditions?", "What are the impacts of the epidemic on the work environment?", "Do you think younger people should be lower paid than older people?", "What skills should be taught at school to improve students' ability to find jobs?", "What kinds of jobs are not paid fairly?"] } },
                { id: "eventsKeep59", title: "征求意见", batch: "keep", part2: { instruction: "Describe a time when someone asked for your opinion.", youShouldSay: ["Who asked for your opinion", "Why he/she wanted to know your opinion", "What opinion you gave", "And explain how you felt when he/she asked for your opinion"] }, part3: { questions: ["What are the disadvantages of sharing opinions on the Internet?", "Why do people like to express their opinions on the Internet nowadays?", "Are there any apps designed for collecting opinions about products or services?", "Why do some people dislike giving their opinions?", "Should teachers give advice to children?", "What should a company do when receiving feedback about its products?"] } },
                { id: "eventsKeep60", title: "交通拥堵", batch: "keep", part2: { instruction: "Describe a time when you were stuck in a traffic jam for a very long time.", youShouldSay: ["When it happened", "Where you were stuck", "What you did while waiting", "And explain how you felt in the traffic jam"] }, part3: { questions: ["How can we solve the traffic jam problem?", "Do you think developing public transport can solve traffic jam problems?", "Do you think the high ways will help reduce traffic jams?", "What are good ways to manage traffic?", "Do you like to use public transport?", "Would you rather be in a car or a bus in a traffic jam?"] } },
                { id: "eventsKeep61", title: "丢东西的经历", batch: "keep", part2: { instruction: "Describe an occasion that you lost something in public.", youShouldSay: ["What you lost", "When and where you lost it", "What you did to find it", "And explain how you felt about it"] }, part3: { questions: ["What kinds of things do people usually lose?", "What will people do when losing things?", "Is it effective to offer rewards to find lost things?", "What kinds of people may lose things often?", "What can we do to reduce the possibility of losing things?", "What do people often feel after losing things?"] } },
                { id: "eventsKeep63", title: "别人讲述的故事", batch: "keep", part2: { instruction: "Describe a story someone told you and you remember.", youShouldSay: ["What the story was about", "Who told you this story", "Why you remember it", "And how you feel about it"] }, part3: { questions: ["Do young children like the same stories as older children?", "How has technology changed storytelling?", "How do people tell stories to children?", "Why do children like stories?", "Will smart devices affect the relationship between children and parents?", "Which do you think is better, paper books or e-books?"] } },
                { id: "eventsKeep64", title: "不喜欢并想要改变的规则", batch: "keep", part2: { instruction: "Describe a rule you dislike and would like to change in the future.", youShouldSay: ["What it is", "What it is for", "Why you don't like it", "And explain why you would like to change it"] }, part3: { questions: ["What are the rules students should follow at school?", "Are the rules at school good or bad? Why?", "What rules should children follow at home?", "How are people punished when parking at a wrong spot?", "When is it okay to break the rules?", "Do you know anyone who has broken the law? How?"] } },
                { id: "eventsKeep65", title: "节约时间的方法/改变", batch: "keep", part2: { instruction: "Describe a way/change that helps you save a lot of time.", youShouldSay: ["What it is", "How you implement it", "How difficult it is", "And explain how you feel about the way/change"] }, part3: { questions: ["What can people do to save time?", "Does technology help people save time? How and why?", "Do you think parents should be responsible for teaching children to save time?", "Do people who can manage time well become successful more easily?", "Is it necessary for children to learn time management?", "What can schools do to help students learn time management?"] } },
                { id: "eventsKeep67", title: "工作/学习中的积极建议", batch: "keep", part2: { instruction: "Describe an occasion when someone gave you positive advice or suggestions about your work/study.", youShouldSay: ["Who the person is", "What he/she said", "How the advice/suggestion affected you", "And explain how you felt about the advice/suggestions"] }, part3: { questions: ["When should parents encourage their children?", "Should parents always encourage their children?", "Do you think negative feedback is more important than positive feedback? Why?", "Why is negative feedback as important as positive feedback at work or in study?", "Which is more important for adults in the workplace, positive feedback or negative feedback?", "Do you think people care about others' comments about them?"] } },
                { id: "eventsKeep68", title: "保健方式", batch: "keep", part2: { instruction: "Describe something you do to keep fit and healthy.", youShouldSay: ["What it is", "When you do it", "Who you do it with", "Why it is important to keep fit and healthy", "And explain why it can help you keep fit and healthy"] }, part3: { questions: ["How do children and old people keep fit and healthy?", "What do people normally do to keep fit and healthy in your country?", "How can parents help and guide their kids to keep healthy?", "Do you think it is good for governments to utilize popular celebrities to help build health awareness?", "How can we use technology to keep fit?", "Should schools provide physical education to students? Why and how?"] } },
                { id: "eventsKeep71", title: "送朋友的礼物", batch: "keep", part2: { instruction: "Describe a gift you would like to buy for your friend.", youShouldSay: ["How you knew your friend", "How long you have known him/her", "How you would choose a gift for him/her", "And explain why you would choose that gift for him/her"] }, part3: { questions: ["When do people normally send gifts to others?", "Is it hard to choose a gift?", "Will people feel happy when receiving an expensive gift?", "Which do people give on traditional festivals, red envelopes or other kinds of gifts?", "What do people usually consider when buying gifts?", "Are there any unlucky things that people should not buy as gifts in your country?"] } },
                { id: "eventsKeep74", title: "壮志未酬", batch: "keep", part2: { instruction: "Describe an ambition that you haven't achieved.", youShouldSay: ["What it is", "Why you haven't achieved it", "What you are doing about it now", "And how you feel about it"] }, part3: { questions: ["What ambitions do children usually have?", "Why are some people very ambitious in their work?", "Why don't some people have dreams?", "How do people balance work and life?", "Why do some people like to be the manager in the workplace?", "What are the traits of ambitious people?"] } },
                { id: "eventsKeep75", title: "向长者学习的技能", batch: "keep", part2: { instruction: "Describe a skill that you learned from older people.", youShouldSay: ["What the skill is", "Who you learned it from", "How you learned it", "And how you feel about it"] }, part3: { questions: ["What can children learn from their parents?", "What kind of help do you think older people need?", "What skills can young people learn from older people?", "What knowledge can children learn from their grandparents?", "What new skills can old people learn?", "Do you think many old people in your country feel lonely?"] } },
                { id: "eventsKeep76", title: "用手机做重要事情", batch: "keep", part2: { instruction: "Describe a time you used your cellphone/smartphone to do something important.", youShouldSay: ["What happened", "When it happened", "How important the cellphone/smartphone was", "And explain how you felt about the experience"] }, part3: { questions: ["What do you usually do with a cellphone?", "What are the differences between young people and old people when using a cellphone?", "Which one is more important, using a cellphone to make phone calls or to read messages?", "Do you think there should be a law to stop people from making phone calls in public?", "What can be done to stop cellphone addiction?", "Do you think it is too late to call others at 11 or 12 o'clock at night?"] } },
                { id: "eventsKeep77", title: "帮助小孩", batch: "keep", part2: { instruction: "Describe a time when you helped a child.", youShouldSay: ["When it was", "How you helped him/her", "Why you helped him/her", "And how you felt about it"] }, part3: { questions: ["What can schools do to develop students' awareness of volunteering?", "Why is it necessary to do volunteer services?", "What can you do to help your neighbors?", "Do people in your country like to help neighbors?", "Why is it important to help neighbors?", "Should developed countries provide technological help to developing countries?"] } },
                { id: "eventsKeep78", title: "免费物品", batch: "keep", part2: { instruction: "Describe something you received for free.", youShouldSay: ["What it was", "Who you received it from", "Where you received it", "And how you felt about it"] }, part3: { questions: ["Why do companies give free things to people?", "Do you think people like free things?", "What kind of free things do companies usually give?", "Do you think people value free things less than things they pay for?"] } },
                { id: "eventsKeep81", title: "改变世界的发明", batch: "keep", part2: { instruction: "Describe an invention that has changed the world in a positive way.", youShouldSay: ["What it is", "What benefits it has brought", "How it influences people of different ages", "And explain how it changed people's lives"] }, part3: { questions: ["What is the most helpful innovation at home?", "What household appliances make us lazy?", "What kinds of inventions can be used at school?", "Do you think AI will replace human teachers? Why?"] } },
                { id: "eventsKeep83", title: "迟到", batch: "keep", part2: { instruction: "Describe a time when you missed or were late for an important meeting/event.", youShouldSay: ["When it happened", "What happened", "Why you missed/were late for it", "And explain how you felt about this experience"] }, part3: { questions: ["Are you a punctual person?", "Do you think it is important to be on time?", "Do you always avoid being late?", "Why are people often late for meetings or appointments?", "Are people in your country often late for meetings?", "Do you think people are born with time management skills or they can develop them?"] } }

                { id: "objectsKeep8", title: "别人给你的衣服", batch: "keep", part2: { instruction: "Describe an item of clothing that someone gave you.", youShouldSay: ["What the clothing was", "Who gave it to you", "When you got it", "And explain why this person gave you the clothing"] }, part3: { questions: ["Why do people from different countries wear different clothing?", "What are the advantages and disadvantages of wearing uniforms at work and school?", "Why do people dress casually in everyday life but dress formally at work?", "Have you ever given clothes to others?", "What are the advantages and disadvantages of wearing a uniform at school?", "What influences the way people dress in today's society?"] } },
                { id: "objectsKeep9", title: "收到特殊蛋糕", batch: "keep", part2: { instruction: "Describe a special cake you received from others.", youShouldSay: ["When it happened", "Where it happened", "Who you got the cake from", "And explain why it's a special cake"] }, part3: { questions: ["Do you think it's good to communicate when eating with your family?", "Why are some people willing to spend a lot of money on meals on special days?", "Is there any food in your country that is eaten at special times or on special occasions?", "What are the differences between special food in China and other countries?", "In your country, do people nowadays cook at home as frequently as people did in the past?", "What do you think of people using their mobile phones during a meal?"] } },

                { id: "objectsKeep11", title: "坏掉又修好的东西", batch: "keep", part2: { instruction: "Describe something that was broken in your home and then repaired.", youShouldSay: ["What it is", "How it was broken", "How you got it repaired", "And how you felt about it"] }, part3: { questions: ["Are IT-related jobs valued more by society?", "Is the quality of products worse than before?", "What kinds of things do people like to repair by themselves?", "Why do people like to get their mobile phones repaired in specialized stores?", "Do you think luxury products are of better quality?", "What kinds of things are easily repaired?"] } },

                { id: "placesKeep5", title: "理想房屋", batch: "keep", part2: { instruction: "Describe an ideal and perfect place where you would like to stay.", youShouldSay: ["Where it would be", "What it would look like", "What special features it would have", "Whether it would be big or small", "And explain why it would be an ideal place for you"] }, part3: { questions: ["What are apartments like in your country?", "Why are apartments popular in some places while not in other places?", "What would people normally consider when they rent or buy a house or an apartment?", "Do different people have different preferences for houses or apartments?", "Why do some people choose to live in the city center?", "What do you think buildings will be like in the future?"] } },
                { id: "placesKeep6", title: "喜欢和亲友去的地方", batch: "keep", part2: { instruction: "Describe a place in your hometown/city that is different from other places and that you enjoy visiting with your parents/friends.", youShouldSay: ["Where it is", "What it is like", "What you often do there", "Who you often go there with", "And explain why you think it is different"] }, part3: { questions: ["What are the differences between big cities and small cities?", "Where do people in your hometown like to go?", "What are the differences between the places young people like to go and the places old people like to go?", "What do young people like to do in their leisure time?", "Do you think it is necessary to visit the same place many times?", "What factors attract people to go to visit other places other than their hometown?"] } },
                { id: "placesKeep7", title: "公园/花园", batch: "keep", part2: { instruction: "Describe a public park or garden.", youShouldSay: ["Where it is", "What it is like", "How often you go there", "What you often do there", "And explain how you feel about it"] }, part3: { questions: ["Is it necessary to have public parks in cities?", "What facilities are needed in a park?", "What are the differences between a garden and a natural area?", "Why do people like to visit tourist attractions?", "What tourist attractions are popular in China?", "How can we encourage young people to go to parks more often?"] } },
                { id: "placesKeep8", title: "别人房间", batch: "keep", part2: { instruction: "Describe someone else's room you enjoy spending time in.", youShouldSay: ["When you visited there", "Whose room it is", "What it is like", "What you can do in it", "And explain why you enjoy spending time there"] }, part3: { questions: ["Do you like to invite your friends to your home?", "Do most people visit other people's houses during the Spring Festival?", "Why do people often take gifts with them when they visit others' homes?", "What are the most enjoyable parts of having a meal together with your family?", "Who likes to stay at home more, young people or old people?", "Do you think old people will be able to keep up with the pace of technology in 50 years?"] } },
                { id: "placesKeep9", title: "看到野生动物的地方", batch: "keep", part2: { instruction: "Describe a place you know where people can see a lot of wildlife.", youShouldSay: ["Where it is", "What kinds of wildlife people can see there", "Whether people like to go there", "And explain how you feel about it"] }, part3: { questions: ["Why are most children interested in wild animals?", "Should parents take their children to the zoo to see wild animals?", "Are wild animals easy to spot in your country?", "Are there many wildlife documentaries produced in your country?", "What impacts does only seeing wild animals in zoos have on children's understanding of these animals?", "Which is the better way to see wildlife, watching documentaries or going into the wild?"] } },
                { id: "placesKeep10", title: "重要河流/湖泊", batch: "keep", part2: { instruction: "Describe an important river/lake in your country.", youShouldSay: ["Where it is located", "How big/long it is", "What it looks like", "And explain why it is important"] }, part3: { questions: ["How can rivers and lakes benefit local people?", "Do you think rivers and lakes attract tourists?", "How do rivers and lakes affect local tourism?", "Are rivers and lakes good for transport? Why?", "What are the popular water sports in your country?", "Are rivers and lakes important to a country?"] } },
                { id: "placesKeep11", title: "一个去过的新地方", batch: "keep", part2: { instruction: "Describe a time you visited a new place.", youShouldSay: ["Where the new place is", "When you went there", "Why you went there", "And explain how you feel about the place"] }, part3: { questions: ["Which do you prefer, living in a city or only visiting it as a tourist?", "How do young children react when they go to school for the first time?", "Why do some people want to go to college far away from home?", "How do young and old people react differently to new things?", "Do you think it's important to get as much information as possible before going to a new place?", "Why do many people enjoy visiting a new place?"] } },
                { id: "placesKeep12", title: "有趣/著名的城市", batch: "keep", part2: { instruction: "Describe a city that you think is very interesting/famous.", youShouldSay: ["Where it is", "What it is famous for", "How you knew this city", "And explain why you think it is very interesting/famous"] }, part3: { questions: ["What advantages can tourism bring to a city?", "Why do some young people like to live in cities?", "Do most elderly people live in the city or in the countryside?", "Do you think well-developed tourism will have negative effects on local people?", "What are the benefits of urbanization?", "Do you think the big cities in China today will become even larger in the future?"] } },
                { id: "placesKeep13", title: "安静的地方", batch: "keep", part2: { instruction: "Describe a quiet place you like to go.", youShouldSay: ["Where it is", "How you knew it", "How often you go there", "What you do there", "And explain how you feel about the place"] }, part3: { questions: ["Is it easy to find quiet places in your country? Why?", "How do people spend their leisure time in your country?", "How does technology affect the way people spend their leisure time?", "Do you think only old people have time for leisure?", "Why do old people prefer to live in quiet places?", "Why are there more noises made at home now than in the past?"] } },
                { id: "placesKeep14", title: "去过的乡村", batch: "keep", part2: { instruction: "Describe a countryside that you have been to.", youShouldSay: ["Where it is", "When and why you went there", "Who you went there with", "And explain how you felt about it"] }, part3: { questions: ["Do people in your country like to go hiking?", "Do most people prefer to live in big cities or in the countryside?", "Do people go to the countryside to travel or to live?", "What kind of people would like to stay in the countryside?", "What are the advantages and disadvantages of living in the countryside?", "What are the differences between the city and the countryside?"] } },
                { id: "placesKeep15", title: "去过且推荐的宜居之地", batch: "keep", part2: { instruction: "Describe a place you have been to that you would recommend as a good place to live.", youShouldSay: ["Where it is", "When you went there", "What makes it a good place to live", "And explain why you would recommend it"] }, part3: { questions: ["Why do people move from one place to another?", "What should people prepare before they move to a different city?", "What kinds of place do people in your country prefer to live in?", "What are the benefits of living close to one's workplace?", "What factors make a city liveable?", "Why do many people choose to move to big cities?"] } }
            ]
        };

        // ---------- 全局变量 ----------
        let currentPart = "part1";
        let currentTopic = null;
        let timerInterval;
        let timerSeconds = 60;
        let isTimerRunning = false;
        let isPart2Mode = false;

        // ---------- 初始化页面 ----------
        document.addEventListener('DOMContentLoaded', function() {
            buildSidebar();
            setupEventListeners();
            
            // 默认选中第一个话题（万年老题的第一个）
            setTimeout(() => {
                const firstTopic = document.querySelector('#old-part1-topics .topic-item');
                if (firstTopic) {
                    firstTopic.classList.add('active');
                    const topicId = firstTopic.getAttribute('data-id');
                    findAndShowTopic(topicId);
                }
            }, 100);
        });

        // ---------- 构建左侧导航 ----------
        function buildSidebar() {
            const nav = document.getElementById('categoryNav');
            nav.innerHTML = `
                <!-- 万年老题 Part 1 -->
                <div class="category-group">
                    <div class="category-header old">📜 万年老题 Part 1 (5组)</div>
                    <button class="category-btn old" data-category="old-part1">
                        <span><i class="fas fa-history" style="color: #9c6b3f; margin-right: 8px;"></i>万年老题 Part 1 (5组)</span>
                        <i class="fas fa-chevron-down icon"></i>
                    </button>
                    <div class="topic-list old" id="old-part1-topics"></div>
                </div>
                
                <!-- Part 1 新增题 -->
                <div class="category-group">
                    <div class="category-header new">📋 Part 1 新增题 (17组)</div>
                    <button class="category-btn new" data-category="part1-new">
                        <span><i class="fas fa-star" style="color: #ffd700; margin-right: 8px;"></i>Part 1 新增题 (17组)</span>
                        <i class="fas fa-chevron-down icon"></i>
                    </button>
                    <div class="topic-list new" id="part1-new-topics"></div>
                </div>
                
                <!-- Part 1 保留题 -->
                <div class="category-group">
                    <div class="category-header keep">📋 Part 1 保留题 (63组)</div>
                    <button class="category-btn keep" data-category="part1-keep">
                        <span><i class="fas fa-bookmark" style="color: #b08968; margin-right: 8px;"></i>Part 1 保留题 (63组)</span>
                        <i class="fas fa-chevron-down icon"></i>
                    </button>
                    <div class="topic-list keep" id="part1-keep-topics"></div>
                </div>
                
                <!-- Part 2&3 新增题 - 人物类 -->
                <div class="category-group">
                    <div class="category-header new">👤 Part 2&3 新增 · 人物类 (8组)</div>
                    <button class="category-btn new" data-category="people-new">
                        <span><i class="fas fa-user-plus" style="color: #0F6B6B; margin-right: 8px;"></i>人物类新题 (8组)</span>
                        <i class="fas fa-chevron-down icon"></i>
                    </button>
                    <div class="topic-list new" id="people-new-topics"></div>
                </div>
                
                <!-- Part 2&3 新增题 - 事件类 -->
                <div class="category-group">
                    <div class="category-header new">🎭 Part 2&3 新增 · 事件类 (9组)</div>
                    <button class="category-btn new" data-category="events-new">
                        <span><i class="fas fa-calendar-plus" style="color: #0F6B6B; margin-right: 8px;"></i>事件类新题 (9组)</span>
                        <i class="fas fa-chevron-down icon"></i>
                    </button>
                    <div class="topic-list new" id="events-new-topics"></div>
                </div>
                
                <!-- Part 2&3 新增题 - 物品类 -->
                <div class="category-group">
                    <div class="category-header new">📦 Part 2&3 新增 · 物品类 (6组)</div>
                    <button class="category-btn new" data-category="objects-new">
                        <span><i class="fas fa-cube" style="color: #0F6B6B; margin-right: 8px;"></i>物品类新题 (6组)</span>
                        <i class="fas fa-chevron-down icon"></i>
                    </button>
                    <div class="topic-list new" id="objects-new-topics"></div>
                </div>
                
                <!-- Part 2&3 新增题 - 地点类 -->
                <div class="category-group">
                    <div class="category-header new">📍 Part 2&3 新增 · 地点类 (3组)</div>
                    <button class="category-btn new" data-category="places-new">
                        <span><i class="fas fa-map-pin" style="color: #0F6B6B; margin-right: 8px;"></i>地点类新题 (3组)</span>
                        <i class="fas fa-chevron-down icon"></i>
                    </button>
                    <div class="topic-list new" id="places-new-topics"></div>
                </div>
                
                <!-- Part 2&3 保留题 - 人物类 -->
                <div class="category-group">
                    <div class="category-header keep">👥 Part 2&3 保留 · 人物类 (17组)</div>
                    <button class="category-btn keep" data-category="people-keep">
                        <span><i class="fas fa-user-friends" style="color: #b08968; margin-right: 8px;"></i>人物类保留 (17组)</span>
                        <i class="fas fa-chevron-down icon"></i>
                    </button>
                    <div class="topic-list keep" id="people-keep-topics"></div>
                </div>
                
                <!-- Part 2&3 保留题 - 事件类 -->
                <div class="category-group">
                    <div class="category-header keep">🎪 Part 2&3 保留 · 事件类 (43组)</div>
                    <button class="category-btn keep" data-category="events-keep">
                        <span><i class="fas fa-calendar-alt" style="color: #b08968; margin-right: 8px;"></i>事件类保留 (43组)</span>
                        <i class="fas fa-chevron-down icon"></i>
                    </button>
                    <div class="topic-list keep" id="events-keep-topics"></div>
                </div>
                
                <!-- Part 2&3 保留题 - 物品类 -->
                <div class="category-group">
                    <div class="category-header keep">🎁 Part 2&3 保留 · 物品类 (14组)</div>
                    <button class="category-btn keep" data-category="objects-keep">
                        <span><i class="fas fa-gift" style="color: #b08968; margin-right: 8px;"></i>物品类保留 (14组)</span>
                        <i class="fas fa-chevron-down icon"></i>
                    </button>
                    <div class="topic-list keep" id="objects-keep-topics"></div>
                </div>
                
                <!-- Part 2&3 保留题 - 地点类 -->
                <div class="category-group">
                    <div class="category-header keep">🏞️ Part 2&3 保留 · 地点类 (15组)</div>
                    <button class="category-btn keep" data-category="places-keep">
                        <span><i class="fas fa-tree" style="color: #b08968; margin-right: 8px;"></i>地点类保留 (15组)</span>
                        <i class="fas fa-chevron-down icon"></i>
                    </button>
                    <div class="topic-list keep" id="places-keep-topics"></div>
                </div>
            `;

            // 填充所有题目
            fillTopicList('old-part1-topics', topicsData.oldPart1, 'old');
            fillTopicList('part1-new-topics', topicsData.part1New, 'new');
            fillTopicList('part1-keep-topics', topicsData.part1Keep, 'keep');
            fillTopicList('people-new-topics', topicsData.peopleNew, 'new');
            fillTopicList('events-new-topics', topicsData.eventsNew, 'new');
            fillTopicList('objects-new-topics', topicsData.objectsNew, 'new');
            fillTopicList('places-new-topics', topicsData.placesNew, 'new');
            fillTopicList('people-keep-topics', topicsData.peopleKeep, 'keep');
            fillTopicList('events-keep-topics', topicsData.eventsKeep, 'keep');
            fillTopicList('objects-keep-topics', topicsData.objectsKeep, 'keep');
            fillTopicList('places-keep-topics', topicsData.placesKeep, 'keep');
        }

        function fillTopicList(listId, topics, type) {
            const list = document.getElementById(listId);
            topics.forEach(topic => {
                const item = document.createElement('div');
                item.className = `topic-item ${type}`;
                item.textContent = topic.title;
                item.setAttribute('data-id', topic.id);
                list.appendChild(item);
            });
        }

        function setupEventListeners() {
            // 分类按钮点击折叠
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const category = this.getAttribute('data-category');
                    const targetList = document.getElementById(`${category}-topics`);
                    const icon = this.querySelector('.fa-chevron-down, .fa-chevron-up');
                    
                    if (targetList.classList.contains('active')) {
                        targetList.classList.remove('active');
                        if (icon) icon.className = 'fas fa-chevron-down icon';
                    } else {
                        targetList.classList.add('active');
                        if (icon) icon.className = 'fas fa-chevron-up icon';
                    }
                });
            });

            // 话题点击
            document.querySelectorAll('.topic-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.topic-item').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const topicId = this.getAttribute('data-id');
                    findAndShowTopic(topicId);
                });
            });

            // Part切换
            document.querySelectorAll('.part-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const part = this.getAttribute('data-part');
                    document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentPart = part;
                    
                    if (currentTopic) {
                        if (part === 'part1' && currentTopic.part1) showPart1(currentTopic);
                        else if (part === 'part2' && currentTopic.part2) showPart2(currentTopic);
                        else if (part === 'part3' && currentTopic.part3) showPart3(currentTopic);
                    }
                    
                    resetTimerForPart();
                });
            });

            // 计时器
            document.getElementById('start-timer').addEventListener('click', toggleTimer);
            document.getElementById('reset-timer').addEventListener('click', resetTimer);
            
            // 搜索
            document.getElementById('searchInput').addEventListener('input', function(e) {
                const keyword = e.target.value.toLowerCase().trim();
                document.querySelectorAll('.topic-item').forEach(item => {
                    const title = item.textContent.toLowerCase();
                    if (keyword === '' || title.includes(keyword)) {
                        item.style.display = 'block';
                        // 展开父级
                        const parentList = item.closest('.topic-list');
                        if (parentList && keyword !== '') {
                            parentList.classList.add('active');
                            const btn = parentList.previousElementSibling;
                            if (btn && btn.classList.contains('category-btn')) {
                                const icon = btn.querySelector('.fa-chevron-down, .fa-chevron-up');
                                if (icon) icon.className = 'fas fa-chevron-up icon';
                            }
                        }
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        }

        function findAndShowTopic(topicId) {
            const allTopics = [
                ...topicsData.oldPart1, ...topicsData.part1New, ...topicsData.part1Keep,
                ...topicsData.peopleNew, ...topicsData.eventsNew, ...topicsData.objectsNew, ...topicsData.placesNew,
                ...topicsData.peopleKeep, ...topicsData.eventsKeep, ...topicsData.objectsKeep, ...topicsData.placesKeep
            ];
            const topic = allTopics.find(t => t.id === topicId);
            if (topic) {
                currentTopic = topic;
                
                // 更新header和badge
                const cardHeader = document.getElementById('card-header');
                const topicBadge = document.getElementById('topic-badge');
                
                cardHeader.className = 'card-header';
                if (topic.batch === 'new') {
                    cardHeader.classList.add('new');
                    topicBadge.className = 'badge-new';
                    topicBadge.textContent = '新增题';
                } else if (topic.batch === 'keep') {
                    cardHeader.classList.add('keep');
                    topicBadge.className = 'badge-keep';
                    topicBadge.textContent = '保留题';
                } else {
                    cardHeader.classList.add('old');
                    topicBadge.className = 'badge-old';
                    topicBadge.textContent = '万年老题';
                }
                
                // 根据当前part显示内容
                if (currentPart === 'part1' && topic.part1) showPart1(topic);
                else if (currentPart === 'part2' && topic.part2) showPart2(topic);
                else if (currentPart === 'part3' && topic.part3) showPart3(topic);
                else {
                    // 自动切换到有内容的part
                    if (topic.part1) document.querySelector('.part-btn[data-part="part1"]').click();
                    else if (topic.part2) document.querySelector('.part-btn[data-part="part2"]').click();
                    else if (topic.part3) document.querySelector('.part-btn[data-part="part3"]').click();
                }
                
                resetTimerForPart();
            }
        }

        function showPart1(topic) {
            const content = document.getElementById('card-content');
            content.innerHTML = `
                <div class="topic-title ${topic.batch}">${topic.title}</div>
                <div class="task-instruction ${topic.batch}">Answer the following questions:</div>
                <div class="question-list ${topic.batch}">
                    ${topic.part1.questions.map((q, i) => `<div class="question-item ${topic.batch}"><strong>${i+1}.</strong> ${q}</div>`).join('')}
                </div>
            `;
        }

        function showPart2(topic) {
            const content = document.getElementById('card-content');
            content.innerHTML = `
                <div class="topic-title ${topic.batch}">${topic.title}</div>
                <div class="task-instruction ${topic.batch}">${topic.part2.instruction}</div>
                <div class="card-item ${topic.batch}">
                    <h3>You should say:</h3>
                    <ul>
                        ${topic.part2.youShouldSay.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                </div>
            `;
        }

        function showPart3(topic) {
            const content = document.getElementById('card-content');
            content.innerHTML = `
                <div class="topic-title ${topic.batch}">${topic.title}</div>
                <div class="task-instruction ${topic.batch}">Answer the follow-up questions:</div>
                <div class="part3-section ${topic.batch}">
                    <ul>
                        ${topic.part3.questions.map((q, i) => `<li><strong>${i+1}.</strong> ${q}</li>`).join('')}
                    </ul>
                </div>
            `;
        }

        function resetTimerForPart() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            
            if (currentPart === 'part2') {
                timerSeconds = 60;
                document.getElementById('timer').textContent = '01:00';
                document.getElementById('timer-label').textContent = '准备时间';
                isPart2Mode = true;
            } else {
                timerSeconds = 0;
                document.getElementById('timer').textContent = '00:00';
                document.getElementById('timer-label').textContent = '答题时间';
                isPart2Mode = false;
            }
            
            document.getElementById('start-timer').innerHTML = '<i class="fas fa-play-circle"></i> 开始';
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            resetTimerForPart();
        }

        function toggleTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                document.getElementById('start-timer').innerHTML = '<i class="fas fa-play-circle"></i> 开始';
            } else {
                isTimerRunning = true;
                document.getElementById('start-timer').innerHTML = '<i class="fas fa-pause-circle"></i> 暂停';
                
                timerInterval = setInterval(() => {
                    if (currentPart === 'part2' && isPart2Mode) {
                        // Part 2 准备阶段：倒计时
                        if (timerSeconds > 0) {
                            timerSeconds--;
                        }
                        if (timerSeconds === 0) {
                            // 准备时间结束，切换到答题时间（2分钟）
                            isPart2Mode = false;
                            timerSeconds = 0;
                            document.getElementById('timer-label').textContent = '答题时间';
                        }
                    } else {
                        // 答题阶段：正计时
                        timerSeconds++;
                        
                        // Part 2 答题时间满2分钟时显示提示
                        if (currentPart === 'part2' && timerSeconds === 120) {
                            // 可选：添加提示效果，但不改变计时
                            const timerDisplay = document.getElementById('timer');
                            timerDisplay.style.color = '#ff6b6b';
                            setTimeout(() => {
                                timerDisplay.style.color = '';
                            }, 500);
                        }
                    }
                    
                    const mins = Math.floor(timerSeconds / 60);
                    const secs = timerSeconds % 60;
                    document.getElementById('timer').textContent = 
                        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }, 1000);
            }
        }
    </script>
